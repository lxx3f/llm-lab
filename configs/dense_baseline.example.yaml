model:
  name: dense-baseline-small
  architecture: DenseTransformer
  vocab_size: 256
  max_seq_len: 128
  d_model: 128
  n_heads: 4
  n_layers: 2
  d_ff: 512
  dropout: 0.0
  rope_base: 10000.0

experiment:
  seed: 42
  device: cuda
  dtype: float32
  batch_size: 4
  sequence_length: 64
  warmup_steps: 2
  benchmark_steps: 10
  output_dir: docs/experiments/dense-baseline

benchmark:
  measure_parameter_count: true
  measure_forward_loss: true
  measure_forward_latency: true
  measure_decode_latency: true
  measure_peak_memory: true
