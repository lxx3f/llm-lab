model:
  name: dense-owt-formal-curve-d256
  architecture: DenseTransformer
  vocab_size: 8192
  max_seq_len: 64
  d_model: 256
  n_heads: 4
  n_layers: 6
  d_ff: 1024
  dropout: 0.0
  rope_base: 10000.0

data:
  tokenizer: artifacts/tokenizers/owt-bpe/v0.2.0/tokenizer.json
  train_tokens: data/processed/owt-sample/train.tokens.uint16
  train_metadata: data/processed/owt-sample/train.metadata.json
  train_source: data/raw/owt-sample/owt_train.txt
  train_max_bytes: 536870912
  validation_tokens: data/processed/owt-sample/validation.tokens.uint16
  validation_metadata: data/processed/owt-sample/validation.metadata.json
  validation_source: data/raw/owt-sample/owt_valid.txt
  validation_max_bytes: 67108864

training:
  seed: 42
  device: auto
  dtype: float32
  batch_size: 32
  sequence_length: 64
  learning_rate: 0.0003
  weight_decay: 0.1
  max_steps: 5000
  log_interval: 200
  validation_interval: 500
  validation_batches: 16
  scheduler:
    warmup_steps: 200
    min_lr_ratio: 0.1
  amp:
    enabled: true
    dtype: bfloat16
  grad_clip: 1.0
  checkpoint: artifacts/checkpoints/dense-owt-formal-curve-d256.pt