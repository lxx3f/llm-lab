# d_model=256 / SFT 20000 steps — literal objective compliance.
# Used for the 3-seed reproducibility run documented in
# docs/experiments/sft-tool-mvp/README.md (rows 4b).
model:
  name: sft-tool-d256-20k
  architecture: DenseTransformer
  vocab_size: 8192
  max_seq_len: 256
  d_model: 256
  n_heads: 4
  n_layers: 6
  d_ff: 1024
  dropout: 0.0
  rope_base: 10000.0

data:
  tokenizer: artifacts/tokenizers/owt-bpe/v0.2.0/tokenizer.json
  sample_dirs:
    - datasets/tool-calling-d1
    - datasets/tool-calling-d1-llm
  augment_k: 0

training:
  seed: 42
  device: auto
  dtype: float32
  batch_size: 8
  sequence_length: 256
  learning_rate: 0.00005
  weight_decay: 0.01
  max_steps: 20000
  log_interval: 1000
  gradient_accumulation_steps: 1
  scheduler:
    warmup_steps: 200
    min_lr_ratio: 0.1
  checkpoint: artifacts/checkpoints/sft-tool-d256-20k-seed42.pt
