model:
  name: moe-top1-small
  architecture: MoETransformer
  vocab_size: 256
  max_seq_len: 128
  d_model: 128
  n_heads: 4
  n_layers: 2
  d_ff: 512
  dropout: 0.0
  rope_base: 10000.0

moe:
  num_experts: 4
  capacity_factor: 1.0
  aux_loss_weight: 0.01

experiment:
  seed: 42
  device: cuda
  dtype: float32
  batch_size: 4
  sequence_length: 64
  warmup_steps: 2
  benchmark_steps: 10
  output_dir: docs/experiments/moe-top1
