model:
  name: sft-moe-tool-v1
  architecture: MoETransformer
  vocab_size: 8192
  max_seq_len: 256
  d_model: 128
  n_heads: 4
  n_layers: 4
  d_ff: 128
  dropout: 0.0
  rope_base: 10000.0
  moe_num_experts: 4
  moe_aux_loss_coeff: 0.01

data:
  tokenizer: artifacts/tokenizers/owt-bpe/v0.2.0/tokenizer.json
  sample_dirs:
    - datasets/tool-calling-d1
    - datasets/tool-calling-d1-llm
  augment_k: 0

training:
  seed: 42
  device: auto
  dtype: float32
  batch_size: 8
  sequence_length: 256
  learning_rate: 0.00005
  weight_decay: 0.01
  max_steps: 2000
  log_interval: 100
  gradient_accumulation_steps: 1
  scheduler:
    warmup_steps: 100
    min_lr_ratio: 0.1
  checkpoint: artifacts/checkpoints/sft-moe-tool-v1.pt